name: check
on:
  push:
  pull_request:

# Required checks for main (docs/git.md): doctor --strict, scripts/check, scripts/security-check.
# Local and CI run the same commands. .NET comes from backend/global.json (spec 0001); Node comes
# from mobile/.nvmrc (spec 0003). setup-node v7 was taken over from Dependabot #4 by spec 0003 once
# the Node step really runs (plan 0003, D-1).

# Same telemetry opt-out as scripts/check and scripts/security-check (docs/security.md).
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  EXPO_NO_TELEMETRY: "1"

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Workspace health (spec/plan gates are failures in CI)
        run: ./scripts/doctor --strict

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET (SDK pinned by backend/global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Setup Node (version pinned by mobile/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Verification contract
        run: ./scripts/check

  security-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET (SDK pinned by backend/global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: backend/global.json
      - name: Setup Node (version pinned by mobile/.nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
      - name: Dependency vulnerability scan
        run: ./scripts/security-check
