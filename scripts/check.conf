# scripts/check.conf — City Radar verification steps (generated by bootstrap, 2026-10-02).
# One step per line:  <name>: <command>  — runs in order from the repo root, fails fast.
# Same steps locally and in CI. Live provider calls are forbidden here (docs/testing.md).
#
# Backend steps never SKIP (spec 0001). Mobile steps never SKIP either (spec 0003): the mobile
# project exists, so a missing mobile/package.json is an error.

# Backend steps run inside backend/ so backend/global.json pins the SDK (plan 0001, risk 4).
# .NET CLI and test-platform telemetry are opted out (docs/security.md, minimum data; review F-6).
backend-restore: cd backend && DOTNET_CLI_TELEMETRY_OPTOUT=1 TESTINGPLATFORM_TELEMETRY_OPTOUT=1 dotnet restore CityRadar.slnx
backend-build: cd backend && DOTNET_CLI_TELEMETRY_OPTOUT=1 TESTINGPLATFORM_TELEMETRY_OPTOUT=1 dotnet build CityRadar.slnx --no-restore -c Release
backend-format: cd backend && DOTNET_CLI_TELEMETRY_OPTOUT=1 TESTINGPLATFORM_TELEMETRY_OPTOUT=1 dotnet format CityRadar.slnx --verify-no-changes --no-restore
# Tests start in a controlled environment (plan 0001 amendment 2): no inherited exit-code ignore
# list, no launch profile env/arguments.
backend-test: cd backend && env -u TESTINGPLATFORM_EXITCODE_IGNORE DOTNET_CLI_TELEMETRY_OPTOUT=1 TESTINGPLATFORM_TELEMETRY_OPTOUT=1 dotnet test --solution CityRadar.slnx --no-build -c Release --no-launch-profile

# Mobile steps run inside mobile/ with the Node version pinned by mobile/.nvmrc (engine-strict).
# Expo CLI telemetry is opted out (docs/security.md, minimum data).
mobile-install: test -f mobile/package.json || { echo "mobile/package.json yok — mobil adımlar SKIP edilemez (spec 0003)" >&2; exit 1; }; cd mobile && npm ci --no-fund --no-audit
# Every installed Expo-managed package matches what the installed Expo SDK expects
# (node_modules/expo/bundledNativeModules.json; spec 0003 AC-2, bug-fix 0011).
mobile-expo-sdk: cd mobile && npm run check:expo-sdk
mobile-typecheck: cd mobile && npm run typecheck
mobile-lint: cd mobile && npm run lint
mobile-format: cd mobile && npm run format:check
# FD-7 deny-list and FD-6 defense-in-depth host scan (docs/architecture.md).
mobile-forbidden: cd mobile && npm run check:forbidden
# Jest fails when it finds no tests (no --passWithNoTests).
mobile-test: cd mobile && npm run test
# Proves that the FD lint rules and tooling scripts fire (spec 0003 AC-11).
mobile-test-tooling: cd mobile && npm run test:tooling
# Android production bundle/export, no device or network (spec 0003 AC-6).
mobile-export: cd mobile && EXPO_NO_TELEMETRY=1 npm run export:android
