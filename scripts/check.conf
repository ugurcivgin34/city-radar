# scripts/check.conf — City Radar verification steps (generated by bootstrap, 2026-10-02).
# One step per line:  <name>: <command>  — runs in order from the repo root, fails fast.
# Same steps locally and in CI. Live provider calls are forbidden here (docs/testing.md).
#
# Each step SKIPs visibly until its project exists. The first backend / mobile setup features
# create the projects and the tooling these steps call (Directory.Build.props, npm scripts
# typecheck / lint / format:check / test, FD-7 deny-list, clock check) and must leave every
# step green — a SKIP after that point is a defect.

backend-restore: if [ -f backend/CityRadar.slnx ]; then dotnet restore backend/CityRadar.slnx; else echo "SKIP: backend/CityRadar.slnx yok (backend setup henüz yapılmadı)"; fi
backend-build: if [ -f backend/CityRadar.slnx ]; then dotnet build backend/CityRadar.slnx --no-restore -c Release; else echo "SKIP: backend yok"; fi
backend-format: if [ -f backend/CityRadar.slnx ]; then dotnet format backend/CityRadar.slnx --verify-no-changes --no-restore; else echo "SKIP: backend yok"; fi
backend-test: if [ -f backend/CityRadar.slnx ]; then dotnet test backend/CityRadar.slnx --no-build -c Release; else echo "SKIP: backend yok"; fi

mobile-install: if [ -f mobile/package.json ]; then (cd mobile && npm ci); else echo "SKIP: mobile/package.json yok (mobil setup henüz yapılmadı)"; fi
mobile-typecheck: if [ -f mobile/package.json ]; then (cd mobile && npm run typecheck); else echo "SKIP: mobile yok"; fi
mobile-lint: if [ -f mobile/package.json ]; then (cd mobile && npm run lint); else echo "SKIP: mobile yok"; fi
mobile-format: if [ -f mobile/package.json ]; then (cd mobile && npm run format:check); else echo "SKIP: mobile yok"; fi
mobile-test: if [ -f mobile/package.json ]; then (cd mobile && npm run test --if-present -- --ci); else echo "SKIP: mobile yok"; fi
