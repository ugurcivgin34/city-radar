# scripts/check.conf — City Radar verification steps (generated by bootstrap, 2026-10-02).
# One step per line:  <name>: <command>  — runs in order from the repo root, fails fast.
# Same steps locally and in CI. Live provider calls are forbidden here (docs/testing.md).
#
# Backend steps never SKIP (spec 0001). Mobile steps SKIP visibly until the mobile setup feature
# creates the project and its npm scripts (typecheck / lint / format:check / test, FD-7
# deny-list); after that a SKIP is a defect.

# Backend steps run inside backend/ so backend/global.json pins the SDK (plan 0001, risk 4).
backend-restore: cd backend && dotnet restore CityRadar.slnx
backend-build: cd backend && dotnet build CityRadar.slnx --no-restore -c Release
backend-format: cd backend && dotnet format CityRadar.slnx --verify-no-changes --no-restore
backend-test: cd backend && dotnet test --solution CityRadar.slnx --no-build -c Release

mobile-install: if [ -f mobile/package.json ]; then (cd mobile && npm ci); else echo "SKIP: mobile/package.json yok (mobil setup henüz yapılmadı)"; fi
mobile-typecheck: if [ -f mobile/package.json ]; then (cd mobile && npm run typecheck); else echo "SKIP: mobile yok"; fi
mobile-lint: if [ -f mobile/package.json ]; then (cd mobile && npm run lint); else echo "SKIP: mobile yok"; fi
mobile-format: if [ -f mobile/package.json ]; then (cd mobile && npm run format:check); else echo "SKIP: mobile yok"; fi
mobile-test: if [ -f mobile/package.json ]; then (cd mobile && npm run test --if-present -- --ci); else echo "SKIP: mobile yok"; fi
